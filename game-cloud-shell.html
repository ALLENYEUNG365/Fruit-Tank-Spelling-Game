<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Fruit Tank Academy — Cloud Mission</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071321}
#game{display:block;width:100%;height:100%;border:0;background:#071321}
#status{position:fixed;right:12px;bottom:12px;z-index:20;padding:7px 10px;border:1px solid #d9b85a;background:#102a32;color:#f4dc87;font:700 9px monospace;opacity:.92}
</style>
</head>
<body>
<iframe id="game" title="Fruit Tank Academy Game"></iframe>
<div id="status">CLOUD SYNC: CONNECTING…</div>
<script>
const frame=document.getElementById('game');
const status=document.getElementById('status');
function setStatus(text){status.textContent=text}
frame.addEventListener('load',()=>{
  try{
    const doc=frame.contentDocument;
    if(!doc) throw new Error('game document unavailable');
    const script=doc.createElement('script');
    script.src='cloud-sync-v2.js?v=20260914';
    script.onload=()=>setStatus('CLOUD SYNC: READY');
    script.onerror=()=>setStatus('CLOUD SYNC: FAILED');
    doc.head.appendChild(script);
  }catch(e){
    console.warn('[FruitTank Cloud Shell]',e);
    setStatus('CLOUD SYNC: RETRYING…');
  }
});
frame.src='game.html?embedded=1&v=20260914';
</script>
</body>
</html>
