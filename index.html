<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fruit Tank Spelling Game — Pixel Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--ink:#18233b;--cream:#fff6d8;--paper:#f7e7bd;--blue:#4f76ff;--blue2:#3454c8;--green:#6fcf61;--yellow:#ffd75a;--pink:#ff7aa8;--red:#ff5c67;--shadow:#1d2a45}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Press Start 2P",monospace;background:#d9f0d0;color:var(--ink)}
body{overflow:hidden}.app{height:100vh;min-height:620px;padding:18px;display:grid;grid-template-columns:300px 1fr;gap:16px;background:linear-gradient(#d9f0d0 0 48%,#b9d98f 48% 100%);position:relative}
.app:before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.07) 0 2px,transparent 2px 5px);mix-blend-mode:overlay}
.panel,.game-shell{position:relative;z-index:1;border:4px solid var(--ink);box-shadow:8px 8px 0 var(--shadow);background:var(--cream)}
.panel{padding:16px;display:flex;flex-direction:column;gap:12px;overflow:auto}.brand{font-size:15px;line-height:1.7}.brand span{color:var(--blue2)}
.sub{font-size:8px;line-height:1.8;color:#52617d}.fruit-card{height:170px;border:4px solid var(--ink);background:#c8e7a5;display:grid;place-items:center;overflow:hidden;box-shadow:inset 0 0 0 4px #8dbd71}.fruit-card svg{width:130px;height:130px;image-rendering:pixelated;filter:drop-shadow(5px 5px 0 rgba(24,35,59,.25))}
.hud{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{border:3px solid var(--ink);background:#fffdf0;padding:10px;text-align:center}.stat small{display:block;font-size:7px;margin-bottom:8px}.stat b{font-size:14px;color:var(--blue2)}
.word{border:4px solid var(--ink);background:#26385f;color:#fff;padding:13px 8px;text-align:center;font-size:14px;letter-spacing:3px;line-height:1.7;min-height:52px}.word .done{color:#ffd75a}.word .next{color:#8ff0a0;text-shadow:2px 2px 0 #14213d}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{font:inherit;font-size:8px;color:#fff;background:var(--blue);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:11px 6px;cursor:pointer}.btn:hover{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}.btn:active{transform:translate(4px,4px);box-shadow:none}.btn.alt{background:#7b8aa9}.btn.good{background:var(--green);color:#153018}
.settings{border:3px solid var(--ink);background:#f2dfb4;padding:10px;font-size:8px;line-height:1.8}.settings select{font:inherit;font-size:8px;margin-top:6px;width:100%;padding:8px;border:3px solid var(--ink);background:#fffdf0;color:var(--ink)}
.help{font-size:7px;line-height:1.9;color:#52617d;margin-top:auto}.badge{display:inline-block;background:var(--pink);color:#fff;border:3px solid var(--ink);padding:7px;font-size:7px;line-height:1.6}
.game-shell{overflow:hidden;background:#17243e}.game-head{height:48px;border-bottom:4px solid var(--ink);background:#fff2c8;display:flex;align-items:center;justify-content:space-between;padding:0 12px;color:var(--ink);font-size:8px}.life{color:#ff5c67}.canvas-wrap{height:calc(100% - 48px);position:relative;background:#17243e}.canvas-wrap canvas{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}.toast{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:5;background:#fff6d8;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:9px 12px;font-size:8px;opacity:0;transition:.15s;pointer-events:none}.toast.show{opacity:1}.mobile{position:absolute;bottom:14px;left:0;right:0;display:none;justify-content:center;gap:10px}.key{width:58px;height:58px;border:3px solid var(--ink);background:rgba(255,246,216,.88);box-shadow:4px 4px 0 var(--ink);display:grid;place-items:center;font-size:14px;user-select:none;touch-action:none}.key.fire{background:#ff7aa8}.progress{height:7px;background:#253554;border:2px solid var(--ink);position:absolute;left:14px;right:14px;bottom:12px;z-index:4}.progress i{display:block;height:100%;background:#6fcf61;width:0;transition:width .15s}
@media(max-width:900px){body{overflow:auto}.app{height:auto;min-height:100vh;grid-template-columns:1fr;padding:10px}.panel{order:1}.game-shell{order:0;height:62vh;min-height:430px}.mobile{display:flex}.help{margin-top:0}.fruit-card{height:110px}.panel{box-shadow:5px 5px 0 var(--shadow)}}
</style>
</head>
<body>
<div class="app">
  <aside class="panel">
    <div class="brand">🍓 FRUIT<br><span>TANK</span> SPELLING</div>
    <div class="sub">A tiny pixel adventure for learning words.</div>
    <div class="badge">🎯 SHOOT THE LETTERS<br>IN THE CORRECT ORDER!</div>
    <div id="fruitCard" class="fruit-card"></div>
    <div class="hud"><div class="stat"><small>SCORE</small><b id="score">0</b></div><div class="stat"><small>TIME</small><b id="timer">40</b></div></div>
    <div id="word" class="word">_ _ _ _ _</div>
    <div class="settings">DIFFICULTY<select id="difficulty"><option value="Easy">EASY — 60 SEC</option><option value="Normal" selected>NORMAL — 40 SEC</option><option value="Hard">HARD — 20 SEC</option></select></div>
    <div class="controls"><button class="btn good" id="start">▶ START</button><button class="btn alt" id="pause">Ⅱ PAUSE</button><button class="btn" id="next">NEXT ▶</button><button class="btn alt" id="reset">↻ RESET</button></div>
    <div class="help">⌨ ← → MOVE<br>SPACE — HOLD TO AUTO FIRE<br>📱 HOLD ● TO FIRE<br><br>+100 for each word. Wrong letters are safe — keep trying!</div>
  </aside>
  <main class="game-shell">
    <div class="game-head"><span>FRUIT TANK // <span id="round">READY</span></span><span class="life">♥ <span id="combo">0</span> COMBO</span></div>
    <div class="canvas-wrap"><div id="toast" class="toast"></div><canvas id="game" width="320" height="180"></canvas><div class="progress"><i id="progress"></i></div><div class="mobile"><div class="key" data-a="left">◀</div><div class="key fire" data-a="fire">●</div><div class="key" data-a="right">▶</div></div></div>
  </main>
</div>
<script>
const $=s=>document.querySelector(s),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fruits=['apple','banana','orange','grape','peach','pear','mango','lemon','cherry','strawberry','blueberry','pineapple','watermelon','kiwi','papaya','lychee','dragonfruit'].map(word=>({word}));
const TIMES={Easy:60,Normal:40,Hard:20};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function toast(t,ms=850){const e=$("#toast");e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),ms)}
function fruitSVG(name){const S='<svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">',p=(x,y,w,h,c)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${c}"/>`,E='</svg>';let s=S;const data={apple:[[3,5,10,8,'#e84b4b'],[5,3,6,2,'#e84b4b'],[8,1,2,3,'#7b4a2a'],[3,2,4,2,'#6fcf61']],orange:[[3,4,10,9,'#ff9f2f'],[5,2,4,2,'#6fcf61']],banana:[[2,4,11,3,'#ffd75a'],[4,7,7,3,'#ffd75a'],[7,9,3,2,'#ffd75a']],grape:[[5,4,6,3,'#9b59d0'],[3,7,10,3,'#9b59d0'],[5,10,6,3,'#9b59d0'],[7,1,2,4,'#7b4a2a'],[8,2,4,2,'#6fcf61']],lemon:[[2,5,12,6,'#ffe35b'],[4,3,8,2,'#ffe35b'],[4,11,8,2,'#ffe35b']],pear:[[6,2,4,5,'#b8df69'],[4,6,8,7,'#b8df69'],[7,1,2,2,'#7b4a2a'],[8,1,4,2,'#6fcf61']],mango:[[4,3,8,9,'#ffb347'],[2,6,10,5,'#ffb347'],[8,2,3,2,'#6fcf61']],cherry:[[3,8,4,4,'#ff5c67'],[9,8,4,4,'#ff5c67'],[6,3,2,6,'#7b4a2a'],[7,2,4,2,'#6fcf61']],peach:[[4,4,8,9,'#ff9f9f'],[3,6,10,6,'#ff9f9f'],[7,3,2,2,'#6fcf61']],strawberry:[[4,4,8,2,'#6fcf61'],[3,6,10,7,'#ff5c67'],[5,4,6,9,'#ff5c67']],blueberry:[[4,4,8,9,'#5574d8'],[3,7,10,6,'#5574d8'],[6,3,4,2,'#6fcf61']]};if(data[name])data[name].forEach(a=>s+=p(...a));else{s+=p(3,4,10,9,'#8acb68');s+=p(5,2,6,2,'#8acb68')}return s+E}
function setFruit(){$("#fruitCard").innerHTML=fruitSVG(state.word)}
class AudioFX{constructor(){this.c=null}ready(){if(!this.c){const A=window.AudioContext||window.webkitAudioContext;if(!A)return;this.c=new A()}if(this.c.state==='suspended')this.c.resume()}tone(f,d=.07,type='square',v=.05){this.ready();if(!this.c)return;const o=this.c.createOscillator(),g=this.c.createGain(),t=this.c.currentTime;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(this.c.destination);o.start(t);o.stop(t+d+.01)}fire(){this.tone(180,.035,'square',.025)}good(){this.tone(880,.08,'square',.06)}bad(){this.tone(100,.1,'sawtooth',.05)}win(){[660,880,1100].forEach((f,i)=>setTimeout(()=>this.tone(f,.08,'square',.07),i*70))}}
const sfx=new AudioFX();
const canvas=$("#game"),ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;const W=320,H=180;let keys={left:0,right:0,fire:0};
class Player{constructor(){this.x=160;this.y=164;this.cool=0;this.recoil=0}update(dt){this.x+=((keys.right?1:0)-(keys.left?1:0))*110*dt;this.x=clamp(this.x,12,308);this.cool=Math.max(0,this.cool-dt);this.recoil=Math.max(0,this.recoil-dt)}fire(){if(this.cool>0||!state.running||state.paused)return;this.cool=.06;bullets.push({x:this.x,y:this.y-15,vy:-180,life:1});this.recoil=.05;sfx.fire()}draw(){const x=Math.round(this.x),y=Math.round(this.y+(this.recoil?2:0));px('#263a68',x-13,y-5,26,8);px('#4f76ff',x-9,y-10,18,7);px('#7290ff',x-4,y-15,8,6);px('#cbd7ff',x-2,y-21,4,10);px('#18233b',x-12,y+3,5,3);px('#18233b',x+7,y+3,5,3)}}
const player=new Player();let bullets=[],letters=[],particles=[];
function px(c,x,y,w,h=1){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h)}
function spawnLetters(){letters=[];bullets=[];state.word.split('').forEach((ch,i)=>{const a=i/state.word.length*Math.PI*2+.4,r=46+Math.random()*18;letters.push({ch,x:160+Math.cos(a)*r,y:86+Math.sin(a)*r*.55,vx:(Math.random()-.5)*14,vy:(Math.random()-.5)*10,r:10,id:i})})}
function burst(x,y,c='#ffd75a'){for(let i=0;i<8;i++){const a=Math.random()*Math.PI*2,sp=20+Math.random()*35;particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:.35,c})}}
function drawLetter(l,next){const x=Math.round(l.x),y=Math.round(l.y);px(next?'#3153b8':'#263a68',x-9,y-9,18,18);px(next?'#ffd75a':'#fff6d8',x-7,y-7,14,14);ctx.fillStyle=next?'#263a68':'#52617d';ctx.font='9px "Press Start 2P",monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(l.ch.toUpperCase(),x,y+1)}
function drawScene(){ctx.fillStyle='#17243e';ctx.fillRect(0,0,W,H);for(let i=0;i<60;i++){const x=(i*53)%W,y=(i*29)%118;px(i%4?'#294060':'#f7e7bd',x,y,1,1)}px('#304c35',0,148,W,32);for(let x=0;x<W;x+=12)px(x%24?'#416d42':'#527d4d',x,148,8,3);letters.forEach(l=>drawLetter(l,l.ch===state.word[state.index]));bullets.forEach(b=>{px('#ffd75a',b.x-2,b.y-4,4,8);px('#fff6d8',b.x-1,b.y-6,2,2)});particles.forEach(p=>px(p.c,p.x,p.y,2,2));player.draw()}
function update(dt){player.update(dt);if(keys.fire)player.fire();bullets.forEach(b=>{b.y+=b.vy*dt;b.life-=dt});bullets=bullets.filter(b=>b.y>-10&&b.life>0);letters.forEach(l=>{l.x+=l.vx*dt;l.y+=l.vy*dt;if(l.x<12||l.x>308)l.vx*=-1;if(l.y<58||l.y>135)l.vy*=-1});particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=35*dt;p.life-=dt});particles=particles.filter(p=>p.life>0);bullets.forEach(b=>letters.forEach(l=>{if(!b.dead&&Math.hypot(b.x-l.x,b.y-l.y)<11){b.dead=true;const needed=state.word[state.index];if(l.ch===needed){sfx.good();burst(l.x,l.y);letters=letters.filter(q=>q!==l);state.index++;state.combo++;$("#combo").textContent=state.combo;updateWord();if(state.index>=state.word.length){state.score+=100+Math.min(state.combo*5,50);$("#score").textContent=state.score;sfx.win();burst(l.x,l.y,'#6fcf61');setTimeout(newWord,320)}}else{sfx.bad();toast('NEXT: '+needed.toUpperCase(),500);state.combo=0;$("#combo").textContent=0}}}));bullets=bullets.filter(b=>!b.dead);state.time-=dt;if(state.time<=0)newWord();$("#timer").textContent=Math.max(0,state.time|0);$("#progress").style.width=(state.index/state.word.length*100)+'%'}
let state={running:false,paused:false,score:0,time:40,word:'apple',index:0,pool:shuffle(fruits),combo:0};
function updateWord(){let s='';for(let i=0;i<state.word.length;i++)s+=i<state.index?'<span class="done">'+state.word[i].toUpperCase()+'</span> ':i===state.index?'<span class="next">'+state.word[i].toUpperCase()+'</span> ':'_ ';$("#word").innerHTML=s.trim()}
function newWord(){if(!state.pool.length)state.pool=shuffle(fruits);state.word=state.pool.pop().word;state.index=0;state.time=TIMES[$("#difficulty").value];state.combo=0;$("#combo").textContent=0;$("#round").textContent=state.word.toUpperCase();setFruit();updateWord();spawnLetters();toast('SPELL '+state.word.toUpperCase(),650)}
function start(){sfx.ready();state.running=true;state.paused=false;state.score=0;$("#score").textContent=0;state.pool=shuffle(fruits);newWord();toast('GO! HOLD SPACE TO FIRE',900)}
function reset(){state.running=false;state.paused=false;bullets=[];letters=[];particles=[];state.score=0;$("#score").textContent=0;$("#timer").textContent=TIMES[$("#difficulty").value];$("#round").textContent='READY';$("#word").textContent='_ _ _ _ _';$("#fruitCard").innerHTML='';toast('RESET',700)}
$("#start").onclick=()=>{if(!state.running)start();else newWord()};$("#pause").onclick=()=>{if(state.running){state.paused=!state.paused;toast(state.paused?'PAUSED':'GO!',500)}};$("#next").onclick=()=>{if(state.running)newWord()};$("#reset").onclick=reset;
$("#difficulty").onchange=()=>{if(state.running&&!state.paused)state.time=TIMES[$("#difficulty").value];toast($("#difficulty").value.toUpperCase(),500)};
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')keys.left=1;if(e.key==='ArrowRight')keys.right=1;if(e.code==='Space'){keys.fire=1;e.preventDefault()}});addEventListener('keyup',e=>{if(e.key==='ArrowLeft')keys.left=0;if(e.key==='ArrowRight')keys.right=0;if(e.code==='Space')keys.fire=0});
[...document.querySelectorAll('.key')].forEach(el=>{const a=el.dataset.a;const down=e=>{e.preventDefault();keys[a]=1;sfx.ready();if(a==='fire')player.fire()};const up=e=>{e.preventDefault();keys[a]=0};el.addEventListener('pointerdown',down);el.addEventListener('pointerup',up);el.addEventListener('pointerleave',up);el.addEventListener('pointercancel',up)});
let last=performance.now();function loop(t){const dt=Math.min(.033,(t-last)/1000);last=t;if(state.running&&!state.paused)update(dt);drawScene();requestAnimationFrame(loop)}requestAnimationFrame(loop);toast('PIXEL TANK READY',1200);
</script>
</body>
</html>
