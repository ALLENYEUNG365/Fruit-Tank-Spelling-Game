</style></head><body><main class="portal"><section class="inner"><i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i><div class="crest">🍓</div><h1 class="brand">FRUIT TANK ACADEMY</h1><div class="subtitle">AN ADVENTURE IN ENGLISH LEARNING</div><div class="rule"></div><div class="welcome">ENTER THE ACADEMY · CONTINUE YOUR JOURNEY</div><div class="form"><div class="field"><label for="email">STUDENT EMAIL</label><input id="email" type="email" autocomplete="email" placeholder="your@email.com"></div><div class="field"><label for="password">PASSWORD</label><input id="password" type="password" autocomplete="current-password" placeholder="••••••••"></div><div class="actions"><button type="button" class="btn login" id="login">▶ SIGN IN</button><button type="button" class="btn signup" id="signup">✦ CREATE ACCOUNT</button></div><button type="button" class="btn review" id="review">◆ ADAPTIVE REVIEW</button><div id="status" class="status"></div></div><div class="footer"><b>YOUR PROGRESS • YOUR QUEST • YOUR WORDS</b><br>Secure cloud authentication powered by Supabase.</div></section></main><script>
const SUPABASE_URL='https://yxhtshjxvlgswfjhxara.supabase.co';const SUPABASE_KEY='sb_publishable_oLcXJtWtzj515ub8W-B4g_whX0nB6f';const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'fruit-tank-academy-auth'}});const $=s=>document.querySelector(s);const status=t=>$('#status').textContent=t;
