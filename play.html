<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Fruit Tank Academy — Mission</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js?v=20260914"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071321}#game{display:block;width:100%;height:100%;border:0;background:#071321}.status{position:fixed;right:10px;bottom:10px;z-index:20;padding:6px 9px;border:1px solid #d9b85a;background:#102a32;color:#f4dc87;font:700 8px monospace;opacity:.9}.fatal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:#071321;color:#f4dc87;font:700 12px monospace;text-align:center;padding:30px}.fatal div{max-width:620px;border:2px solid #d9b85a;padding:24px;background:#102a32}</style></head><body><iframe id="game" title="Fruit Tank Academy Game"></iframe><div id="status" class="status">MISSION: LOADING</div><script>
const sb=window.FRUIT_TANK_SUPABASE.createClient();
const frame=document.getElementById('game');
const status=document.getElementById('status');
function setStatus(t){status.textContent=t}
function fatal(t){const d=document.createElement('div');d.className='fatal';d.innerHTML='<div>'+t+'</div>';document.body.appendChild(d)}
async function init(){
  try{
    const {data:{session},error}=await sb.auth.getSession();
    if(error||!session){location.replace('auth.html?logout=1');return}
    frame.src='game-core.html?v=adventure-20260914';
    frame.addEventListener('load',()=>{
      setStatus('MISSION: READY');
      try{window.FRUIT_TANK_CLOUD.install(frame)}catch(e){console.warn('[FruitTank Cloud]',e);setStatus('MISSION: READY · LOCAL MODE')}
    },{once:true});
    setTimeout(()=>{if(!frame.contentDocument)setStatus('MISSION: STARTING…')},800);
  }catch(e){console.error(e);fatal('Unable to start the Fruit Tank mission.<br><br>'+String(e.message||e))}
}
window.FRUIT_TANK_CLOUD={install:function(){}};
init();
</script><script src="cloud-sync-core.js?v=20260914"></script></body></html>
