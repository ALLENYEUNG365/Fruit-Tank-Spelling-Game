<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fruit Tank Academy — Student Login</title><style>body{margin:0;background:#17243e;color:#fff;font-family:Arial,sans-serif}.gate{min-height:100vh;display:grid;place-items:center}.card{width:min(560px,92%);background:#fff6d8;color:#18233b;border:5px solid #18233b;box-shadow:9px 9px #0b1020;padding:24px;box-sizing:border-box;text-align:center}.card h1{font-family:monospace;font-size:22px}.card p{font-family:monospace;font-size:12px;line-height:1.8}.card input{width:100%;box-sizing:border-box;margin:6px 0;padding:12px;border:3px solid #18233b;font-size:14px}.btn{border:3px solid #18233b;box-shadow:3px 3px #18233b;padding:12px 16px;background:#4f76ff;color:#fff;font-weight:700;cursor:pointer;margin:5px;text-decoration:none;display:inline-block}.btn:active{transform:translate(3px,3px);box-shadow:none}.ok{background:#6fcf61;color:#153018}.status{font:11px monospace;min-height:18px;margin:8px}.hidden{display:none!important}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body><div id="gate" class="gate"><div class="card"><div style="font-size:40px">🍓</div><h1>FRUIT TANK ACADEMY</h1><p>STUDENT PORTAL // SECURE CLOUD LOGIN</p><input id="email" type="email" autocomplete="email" placeholder="Student email"><input id="password" type="password" autocomplete="current-password" placeholder="Password"><div><button class="btn ok" id="login">SIGN IN</button><button class="btn" id="signup">CREATE ACCOUNT</button></div><div><a class="btn" href="adaptive-review.html">🧠 ADAPTIVE REVIEW</a></div><div class="status" id="status"></div><p style="font-size:9px;color:#65728b">Sign in to open your Student Portal. Your learning progress is synchronized securely to the cloud.</p></div></div>
<script>
const SUPABASE_URL='https://yxhtshjxvlgswfjhxara.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl4aHRzaGp4dmxnc3dmamh4YXJhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU3MjE2MjMsImV4cCI6MjA4MTI5NzYyM30.J4kpzCZkKiU4E0wFHxBgmBr-mKGD6MF9AGS8nTJKDM4';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const $=s=>document.querySelector(s);const status=t=>$('#status').textContent=t;
function go(){location.href='student-portal.html'}
$('#login').onclick=async()=>{const email=$('#email').value.trim(),password=$('#password').value;if(!email||!password)return status('Enter your email and password.');status('Signing in…');const {error}=await sb.auth.signInWithPassword({email,password});if(error)return status('LOGIN ERROR: '+error.message);status('Login successful. Opening portal…');setTimeout(go,250)};
$('#signup').onclick=async()=>{const email=$('#email').value.trim(),password=$('#password').value;if(!email||password.length<6)return status('Enter an email and a 6+ character password.');status('Creating student account…');const {data,error}=await sb.auth.signUp({email,password});if(error)return status('CREATE ACCOUNT ERROR: '+error.message);if(data.session){status('Account created. Opening portal…');setTimeout(go,250)}else status('Account created. Please confirm your email, then sign in.')};
(async()=>{const {data:{session}}=await sb.auth.getSession();if(session)go()})();
</script></body></html>
