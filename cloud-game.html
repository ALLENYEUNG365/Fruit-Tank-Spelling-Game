<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fruit Tank Academy — Cloud Play</title><style>body{margin:0;background:#17243e;color:#fff;font-family:Arial,sans-serif}.gate{min-height:100vh;display:grid;place-items:center}.card{width:min(560px,92%);background:#fff6d8;color:#18233b;border:5px solid #18233b;box-shadow:9px 9px #0b1020;padding:24px;box-sizing:border-box;text-align:center}.card h1{font-family:monospace;font-size:22px}.card p{font-family:monospace;font-size:12px;line-height:1.8}.card input{width:100%;box-sizing:border-box;margin:6px 0;padding:12px;border:3px solid #18233b;font-size:14px}.btn{border:3px solid #18233b;box-shadow:3px 3px #18233b;padding:12px 16px;background:#4f76ff;color:#fff;font-weight:700;cursor:pointer;margin:5px;text-decoration:none;display:inline-block}.btn:active{transform:translate(3px,3px);box-shadow:none}.ok{background:#6fcf61;color:#153018}.logout{position:fixed;z-index:1000;top:12px;right:16px;background:#ff5c67;color:#fff;border:3px solid #18233b;box-shadow:4px 4px #0b1020;padding:9px 12px;font:700 11px monospace;cursor:pointer;display:none}.logout.show{display:block}.status{font:11px monospace;min-height:18px;margin:8px}.hidden{display:none!important}#gameFrame{border:0;width:100%;height:100vh;display:block}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body><button class="logout" id="logout" type="button">↪ SIGN OUT</button><div id="gate" class="gate"><div class="card"><h1>🍓 FRUIT TANK ACADEMY</h1><p>CLOUD PLAY // STUDENT DATA SYNC</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><div><button class="btn ok" id="login">SIGN IN & PLAY</button><button class="btn" id="signup">CREATE STUDENT</button></div><div><a class="btn" href="adaptive-review.html">🧠 ADAPTIVE REVIEW</a></div><div class="status" id="status"></div><p style="font-size:9px">Game progress and spelling attempts synchronize to Supabase. Adaptive Review turns repeated errors into a personalized practice queue.</p></div></div><iframe id="gameFrame" class="hidden"></iframe>
<script>
const SUPABASE_URL='https://yxhtshjxvlgswfjhxara.supabase.co';const SUPABASE_KEY='sb_publishable_oLcXJtWtzj515ub8W-B4g_whX0nB6f';const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true});window.supabaseClientForFruitTank=sb;const $=s=>document.querySelector(s),status=t=>$('#status').textContent=t;
async function ensureProfile(){let {data,error}=await sb.rpc('ensure_my_profile');if(error)throw error;return data}
function mergeLocal(remote){const local=JSON.parse(localStorage.getItem('fruitTankAcademy')||'null');if(!local)return remote;const cloudHasProgress=Number(remote.total_words||0)>0||Number(remote.total_shots||0)>0||Number(remote.xp||0)>0||Number(remote.level||1)>1;if(!cloudHasProgress)return {...local};return {...local,xp:Number(remote.xp??local.xp??0),level:Number(remote.level??local.level??1),streak:Math.max(Number(remote.streak??0),Number(local.streak??0)),totalWords:Math.max(Number(remote.total_words??0),Number(local.totalWords??0)),correct:Math.max(Number(remote.correct_attempts??0),Number(local.correct??0)),shots:Math.max(Number(remote.total_shots??0),Number(local.shots??0))}}
async function launch(){const {data:{session}}=await sb.auth.getSession();if(!session){status('Please sign in first.');return}try{status('Syncing profile…');const p=await ensureProfile();localStorage.setItem('fruitTankAcademy',JSON.stringify(mergeLocal(p)));$('#gate').classList.add('hidden');const f=$('#gameFrame');f.src='index.html';f.classList.remove('hidden');$('#logout').classList.add('show')}catch(e){console.error(e);status('SYNC ERROR: '+e.message)}}
async function logout(){const button=$('#logout');button.disabled=true;button.textContent='↪ SIGNING OUT…';try{await sb.auth.signOut()}catch(e){console.warn('Sign out error',e)}finally{const f=$('#gameFrame');f.src='about:blank';f.classList.add('hidden');$('#gate').classList.remove('hidden');button.classList.remove('show');button.disabled=false;button.textContent='↪ SIGN OUT';$('#password').value='';status('Signed out successfully.')}}
$('#login').onclick=async()=>{const email=$('#email').value.trim(),password=$('#password').value;if(!email||!password)return status('Enter email and password.');status('Signing in…');const {error}=await sb.auth.signInWithPassword({email,password});if(error)return status(error.message);await launch()};$('#signup').onclick=async()=>{const email=$('#email').value.trim(),password=$('#password').value;if(!email||password.length<6)return status('Use an email and a 6+ character password.');status('Creating student…');const {error}=await sb.auth.signUp({email,password});if(error)return status(error.message);status('Account created. Check email if confirmation is enabled, then sign in.')};$('#logout').onclick=logout;window.addEventListener('load',async()=>{const {data:{session}}=await sb.auth.getSession();if(session)launch()});
</script><script src="cloud-sync-v2.js"></script></body></html>
