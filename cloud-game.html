<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Fruit Tank Academy — Sign In</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"Courier New",monospace;color:#17242b;background:radial-gradient(circle at 50% 12%,#fff6d7 0,#f4e8bd 45%,#dfd19d 100%);display:grid;place-items:center;padding:24px}.box{width:min(760px,96vw);padding:10px;background:#10242b;border:4px solid #17242b;box-shadow:14px 14px #050b12}.inner{background:#f8edc7;border:4px solid #354a38;padding:34px 48px;text-align:center;box-shadow:inset 0 0 0 4px #d2c48f}.crest{font-size:55px}.brand{margin:8px 0;color:#152b37;font-size:clamp(30px,6vw,58px);letter-spacing:5px;text-shadow:4px 4px #c7b77e}.sub{color:#53634d;letter-spacing:4px;font-size:12px;margin:10px 0 25px}.rule{height:4px;background:#b69a4d;box-shadow:0 5px #dfd19c;margin-bottom:28px}.welcome{color:#6b603f;letter-spacing:3px;font-size:11px;margin-bottom:20px}.form{max-width:560px;margin:auto;text-align:left}.field{margin:14px 0}.field label{display:block;font-weight:900;letter-spacing:2px;font-size:11px;margin-bottom:7px}.field input{width:100%;height:58px;border:4px solid #283c3d;background:#edf2ff;color:#10243a;padding:0 16px;font:700 16px "Courier New",monospace;outline:0;box-shadow:6px 6px #9e8b58}.actions{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}.btn{height:60px;border:4px solid #172b2f;box-shadow:6px 6px #091217;color:#fff;font:900 13px "Courier New",monospace;letter-spacing:1px;cursor:pointer}.login{background:#67c95d;color:#102914}.signup{background:#4269e8}.review{width:100%;margin-top:15px;background:#735fc7}.status{min-height:28px;text-align:center;margin-top:20px;color:#755f37;font-size:10px;line-height:1.6;white-space:pre-line}@media(max-width:600px){.inner{padding:27px 18px}.actions{grid-template-columns:1fr}.brand{letter-spacing:2px}.sub{font-size:9px;letter-spacing:1px}}</style></head><body><main class="box"><section class="inner"><div class="crest">🍓</div><h1 class="brand">FRUIT TANK ACADEMY</h1><div class="sub">AN ADVENTURE IN ENGLISH LEARNING</div><div class="rule"></div><div class="welcome">ENTER THE ACADEMY · CONTINUE YOUR JOURNEY</div><div class="form"><div class="field"><label for="email">STUDENT EMAIL</label><input id="email" type="email" autocomplete="email" placeholder="your@email.com"></div><div class="field"><label for="password">PASSWORD</label><input id="password" type="password" autocomplete="current-password" placeholder="••••••••"></div><div class="actions"><button class="btn login" id="login" type="button">▶ SIGN IN</button><button class="btn signup" id="signup" type="button">✦ CREATE ACCOUNT</button></div><button class="btn review" id="review" type="button">◆ ADAPTIVE REVIEW</button><div id="status" class="status"></div></div></section></main><script>const SUPABASE_URL='https://yxhtshjxvlgswfjhxara.supabase.co';const SUPABASE_KEY='sb_publishable_oLcXJtWtzj515ub8W-B4g_whX0nB6f';const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'fruit-tank-academy-auth'} });const $=s=>document.querySelector(s),status=t=>$('#status').textContent=t;function go(){location.replace('student-portal.html?v=20260913')};$('#login').onclick=async()=>{const email=$('#email').value.trim(),password=$('#password').value;if(!email||!password)return status('ENTER YOUR EMAIL AND PASSWORD.');status('CONNECTING TO ACADEMY…');try{const r=await sb.auth.signInWithPassword({email,password});if(r.error)return status('LOGIN ERROR: '+r.error.message);if(!r.data||!r.data.session)return status('LOGIN ERROR: NO SESSION CREATED.');status('LOGIN SUCCESSFUL · ENTERING PORTAL…');setTimeout(go,180)}catch(e){status('LOGIN ERROR: '+(e&&e.message?e.message:String(e)))}};$('#signup').onclick=async()=>{const email=$('#email').value.trim(),password=$('#password').value;if(!email||password.length<6)return status('ENTER AN EMAIL AND A 6+ CHARACTER PASSWORD.');status('CREATING ACCOUNT…');try{const r=await sb.auth.signUp({email,password});if(r.error)return status('CREATE ACCOUNT ERROR: '+r.error.message);if(r.data&&r.data.session){status('ACCOUNT CREATED · ENTERING PORTAL…');setTimeout(go,180)}else status('ACCOUNT CREATED · CHECK YOUR EMAIL TO CONFIRM.')}catch(e){status('CREATE ACCOUNT ERROR: '+(e&&e.message?e.message:String(e)))}};$('#review').onclick=()=>location.replace('adaptive-review.html?v=20260913');(async()=>{try{if(new URLSearchParams(location.search).get('logout')==='1'){await sb.auth.signOut({scope:'local'});try{localStorage.removeItem('fruit-tank-academy-auth')}catch(e){}history.replaceState(null,'',location.pathname);status('SIGNED OUT · ENTER YOUR CREDENTIALS TO START AGAIN.');return}const r=await sb.auth.getSession();if(r.data&&r.data.session)go()}catch(e){status('AUTHENTICATION ERROR: '+(e&&e.message?e.message:String(e)))}})();</script></body></html>
