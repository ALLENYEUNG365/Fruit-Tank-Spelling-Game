<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fruit Tank Academy — Student Portal</title><style>
:root{--night:#07131c;--deep:#102a2d;--forest:#173d32;--leaf:#2f6847;--moss:#71904c;--gold:#e8c86a;--gold2:#fff0a3;--paper:#f6edc9;--ink:#18233b;--blue:#4269e8;--green:#67c95d;--red:#d95355;--shadow:#050b12}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Courier New",monospace}body{min-height:100vh;overflow-x:hidden;background:var(--night);color:#fff}.scene{min-height:100vh;position:relative;display:grid;place-items:center;padding:42px 18px;overflow:hidden;background:linear-gradient(#081923 0%,#0d2930 48%,#163b32 100%)}.stars,.mist,.mountains,.trees{position:absolute;inset:0;pointer-events:none}.stars{background-image:radial-gradient(circle,#f8e7a0 0 1px,transparent 2px),radial-gradient(circle,#b9d6c1 0 1px,transparent 2px);background-size:83px 71px,127px 113px;background-position:18px 20px,43px 52px;opacity:.42}.moon{position:absolute;width:92px;height:92px;right:11%;top:8%;background:#f6e7a1;box-shadow:0 0 0 7px rgba(246,231,161,.06),0 0 45px rgba(246,231,161,.22);clip-path:polygon(20% 0,80% 0,80% 8%,92% 8%,92% 20%,100% 20%,100% 80%,92% 80%,92% 92%,80% 92%,80% 100%,20% 100%,20% 92%,8% 92%,8% 80%,0 80%,0 20%,8% 20%,8% 8%,20% 8%)}.mountains{top:auto;height:48%;background:linear-gradient(135deg,transparent 0 18%,#102f30 18% 35%,transparent 35% 48%,#123331 48% 67%,transparent 67%),linear-gradient(45deg,transparent 0 20%,#0c282c 20% 42%,transparent 42% 58%,#0c282c 58% 80%,transparent 80%);opacity:.8}.mist{top:auto;height:38%;background:repeating-linear-gradient(0deg,transparent 0 18px,rgba(160,194,151,.06) 18px 24px);filter:blur(2px)}.trees:before,.trees:after{content:"";position:absolute;bottom:-12px;width:32%;height:58%;background:#0a2425;clip-path:polygon(0 100%,0 65%,8% 65%,8% 43%,16% 43%,16% 25%,23% 25%,23% 10%,31% 10%,31% 0,39% 0,39% 16%,48% 16%,48% 34%,57% 34%,57% 52%,68% 52%,68% 72%,80% 72%,80% 55%,90% 55%,90% 100%)}.trees:before{left:-3%}.trees:after{right:-3%;transform:scaleX(-1)}
.portal{position:relative;z-index:3;width:min(720px,96vw);padding:10px;background:#101d25;border:4px solid #0a0e13;box-shadow:0 0 0 3px #48634d,14px 14px 0 #03080d,0 0 50px rgba(0,0,0,.35)}.inner{position:relative;background:var(--paper);color:var(--ink);border:4px solid #354a38;padding:34px 44px 28px;text-align:center;box-shadow:inset 0 0 0 4px #d2c48f}.ornament{position:absolute;width:22px;height:22px;border:4px solid #9a7e38}.ornament.tl{left:12px;top:12px;border-right:0;border-bottom:0}.ornament.tr{right:12px;top:12px;border-left:0;border-bottom:0}.ornament.bl{left:12px;bottom:12px;border-right:0;border-top:0}.ornament.br{right:12px;bottom:12px;border-left:0;border-top:0}.crest{margin:0 auto 15px;width:88px;height:72px;position:relative;image-rendering:pixelated}.crest .leaf{position:absolute;left:38px;top:0;width:12px;height:24px;background:#477b3f;box-shadow:12px 4px #477b3f}.crest .berry{position:absolute;left:20px;top:19px;width:48px;height:45px;background:#ee405b;clip-path:polygon(20% 0,80% 0,80% 8%,94% 8%,94% 28%,100% 28%,100% 58%,88% 58%,88% 78%,72% 78%,72% 92%,58% 92%,58% 100%,42% 100%,42% 92%,28% 92%,28% 78%,12% 78%,12% 58%,0 58%,0 28%,6% 28%,6% 8%,20% 8%);box-shadow:inset 0 -7px rgba(128,24,53,.18)}.crest .seed{position:absolute;width:5px;height:8px;background:#24334c;transform:rotate(12deg)}.s1{left:33px;top:31px}.s2{left:50px;top:38px}.s3{left:42px;top:51px}.s4{left:57px;top:28px}.brand{font-size:clamp(25px,5vw,45px);letter-spacing:5px;font-weight:900;margin:0;text-shadow:3px 3px #c7b77e;color:#152b37}.subtitle{font-size:12px;letter-spacing:3px;color:#53634d;margin:10px 0 26px}.rule{height:4px;background:#b69a4d;margin:0 auto 23px;max-width:510px;box-shadow:0 5px 0 #dfd19c}.welcome{font-size:11px;letter-spacing:2px;margin-bottom:15px;color:#6b603f}.form{max-width:520px;margin:auto;text-align:left}.field{margin-bottom:13px}.field label{display:block;font-size:10px;font-weight:bold;letter-spacing:2px;margin:0 0 6px 3px}.input-wrap{position:relative}.input-wrap:before{content:"";position:absolute;left:10px;top:50%;width:9px;height:9px;background:#b49a51;transform:translateY(-50%);z-index:1}.field input{width:100%;height:55px;border:4px solid #283c3d;background:#e9e5d2;color:#14283a;padding:0 15px 0 31px;font:700 15px "Courier New",monospace;outline:none;box-shadow:5px 5px 0 #9e8b58}.field input:focus{background:#fffbea;border-color:#355b48;box-shadow:5px 5px 0 #6d8c5c}.actions{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:18px}.btn{height:58px;border:4px solid #172b2f;box-shadow:6px 6px 0 #091217;background:var(--blue);color:#fff;font:900 13px "Courier New",monospace;letter-spacing:1px;cursor:pointer;transition:transform .08s,box-shadow .08s}.btn:hover{filter:brightness(1.08)}.btn:active{transform:translate(5px,5px);box-shadow:1px 1px 0 #091217}.btn.login{background:var(--green);color:#102914}.btn.review{width:100%;margin-top:13px;background:#735fc7}.status{min-height:25px;text-align:center;font-size:10px;line-height:1.6;margin:18px 0 8px;color:#755f37}.footer{font-size:9px;line-height:1.7;color:#6e725f;letter-spacing:1px;margin:18px auto 0;max-width:530px}.footer b{color:#486442}.corner-note{position:absolute;top:15px;right:18px;font-size:8px;color:#b7c7a9;letter-spacing:1px;z-index:5}.hidden{display:none!important}@media(max-width:600px){.scene{padding:20px 10px}.portal{width:100%}.inner{padding:27px 18px 22px}.brand{letter-spacing:2px}.subtitle{font-size:9px;letter-spacing:1px}.actions{grid-template-columns:1fr}.btn.review{margin-top:11px}.moon{width:60px;height:60px;right:7%;top:4%}.corner-note{display:none}}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body><div class="scene"><div class="corner-note">FRUIT TANK ACADEMY · STUDENT PORTAL</div><div class="stars"></div><div class="moon"></div><div class="mountains"></div><div class="mist"></div><div class="trees"></div><main class="portal"><section class="inner"><i class="ornament tl"></i><i class="ornament tr"></i><i class="ornament bl"></i><i class="ornament br"></i><div class="crest"><span class="leaf"></span><span class="berry"></span><i class="seed s1"></i><i class="seed s2"></i><i class="seed s3"></i><i class="seed s4"></i></div><h1 class="brand">FRUIT TANK ACADEMY</h1><div class="subtitle">AN ADVENTURE IN ENGLISH LEARNING</div><div class="rule"></div><div class="welcome">ENTER THE ACADEMY · CONTINUE YOUR JOURNEY</div><div class="form"><div class="field"><label for="email">STUDENT EMAIL</label><div class="input-wrap"><input id="email" type="email" autocomplete="email" placeholder="your@email.com"></div></div><div class="field"><label for="password">PASSWORD</label><div class="input-wrap"><input id="password" type="password" autocomplete="current-password" placeholder="••••••••"></div></div><div class="actions"><button class="btn login" id="login">▶ SIGN IN</button><button class="btn" id="signup">✦ CREATE ACCOUNT</button></div><button class="btn review" id="review">◆ ADAPTIVE REVIEW</button><div class="status" id="status"></div></div><div class="footer"><b>YOUR PROGRESS • YOUR QUEST • YOUR WORDS</b><br>Sign in to open your Student Portal. Learning progress is synchronized securely to the cloud.</div></section></main></div>
<script>
const SUPABASE_URL='https://yxhtshjxvlgswfjhxara.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl4aHRzaGp4dmxnc3dmamh4YXJhIiwiaWF0IjoxNzY1NzIxNjIzLCJleHAiOjIwODEyOTc2MjN9.J4kpzCZkKiU4E0wFHxBgmBr-mKGD6MF9AGS8nTJKDM4';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const $=s=>document.querySelector(s);const status=t=>$('#status').textContent=t;
function go(){location.href='student-portal.html'}
$('#login').onclick=async()=>{const email=$('#email').value.trim(),password=$('#password').value;if(!email||!password)return status('ENTER YOUR EMAIL AND PASSWORD.');status('OPENING YOUR ADVENTURE…');const {error}=await sb.auth.signInWithPassword({email,password});if(error)return status('LOGIN ERROR: '+error.message);status('LOGIN SUCCESSFUL · ENTERING PORTAL…');setTimeout(go,250)};
$('#signup').onclick=async()=>{const email=$('#email').value.trim(),password=$('#password').value;if(!email||password.length<6)return status('ENTER AN EMAIL AND A 6+ CHARACTER PASSWORD.');status('CREATING YOUR STUDENT ACCOUNT…');const {data,error}=await sb.auth.signUp({email,password});if(error)return status('CREATE ACCOUNT ERROR: '+error.message);if(data.session){status('ACCOUNT CREATED · ENTERING PORTAL…');setTimeout(go,250)}else status('ACCOUNT CREATED · CHECK YOUR EMAIL TO CONFIRM.')};
$('#review').onclick=()=>location.href='adaptive-review.html';
(async()=>{const forceLogout=new URLSearchParams(location.search).get('logout')==='1';if(forceLogout){try{await sb.auth.signOut({scope:'local'})}catch(e){console.warn('Forced local sign-out warning:',e)}history.replaceState(null,'','cloud-game.html');return}const {data:{session}}=await sb.auth.getSession();if(session)go()})();
</script></body></html>
